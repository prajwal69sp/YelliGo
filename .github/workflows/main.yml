name: Build YelliGo APKs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-customer-app:
    name: Build Customer App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Android platform scaffold (if missing)
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.yelligo .
          fi

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: yelligo-customer-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-captain-app:
    name: Build Captain (Driver) App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        working-directory: captain
        run: flutter pub get

      - name: Generate Android platform scaffold (if missing)
        working-directory: captain
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.yelligo .
          fi

      - name: Build release APK
        working-directory: captain
        run: flutter build apk --release

      - name: Upload Captain APK
        uses: actions/upload-artifact@v4
        with:
          name: yelligo-captain-app
          path: captain/build/app/outputs/flutter-apk/app-release.apk
